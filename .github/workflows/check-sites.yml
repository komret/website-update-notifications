name: Check Website Updates

on:
  schedule:
    - cron: '0 7 * * *'  # 9am Prague summer (CEST=UTC+2); 8am in winter
  workflow_dispatch:       # also triggerable manually for testing

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm install playwright nodemailer
          npx playwright install chromium --with-deps

      - name: Check sites for updates
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node check-sites.js
